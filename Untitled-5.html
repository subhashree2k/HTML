
<!DOCTYPE html>
<html>
<head>
    <title>Report Card</title>

    <style>
        body {
            background-image:"image.jpeg";
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h2 {
            color: darkblue;
        }

        img {
            width: 120px;
            height: 120px;
            border: 4px solid navy;
            border-radius: 50%;
            object-fit: cover;
        }

        table {
            margin: auto;
            border: 3px solid navy;
            border-collapse: collapse;
            width: 400px;
            background-color: white;
        }

        th, td {
            border: 2px solid blue;
            padding: 12px;
        }

        th {
            background-color: lightblue;
            color: darkblue;
        }

        td {
            color: black;
        }

        tr:last-child {
            background-color: lightgreen;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>Student Report Card</h2>

    <img src="image.jpeg" alt="Student Photo">

    <p>
        <b>Name:</b> Aarav Sharma<br>
        <b>Roll No:</b> 104<br>
        <b>Class:</b> 10th
    </p>

    <table>
        <tr>
            <th>Subject</th>
            <th>Marks</th>
            <th>Grade</th>
        </tr>

        <tr>
            <td>Math</td>
            <td>92</td>
            <td>A+</td>
        </tr>

        <tr>
            <td>Science</td>
            <td>80</td>
            <td>A</td>
        </tr>

        <tr>
            <td>English</td>
            <td>93</td>
            <td>A+</td>
        </tr>

        <tr>
            <th>Total</th>
            <th>265/300</th>
            <th>Pass</th>
        </tr>
    </table>

</body>
</html>
