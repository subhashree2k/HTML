<!DOCTYPE html>
<html>
    <head>
        <style>
            .container{
                display: grid;
                grid-template-columns: auto auto auto;
                gap: 5px;
                background-color: dodgerblue;
                padding: 5px;
            }
            .container div{
                background-color: #d45aca;
                padding: 10px;
                font-size: 30px;
                text-align: center;
            }
            .item1{
                grid-column-start: 1;
                grid-column-end: 3;
            }
        </style>
        </head>
        <body>
            <h1>Grid column start and the grid-column -end properties .</h1>
            <p> let the first grid item start at column line 1 and end on column line 3</p>
            <div class ="container">
            <div class="item1">1</div>
                <div class="item2">2</div>
                <div class="item3">3</div>
                <div class="item4">4</div>
                <div class="item5">5</div>
            </div>
                
        </body>
            
</html>
